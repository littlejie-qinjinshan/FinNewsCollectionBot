name: Daily Finance News Job

on:
  schedule:
    # 每天北京时间9:00执行（UTC时间1:00）
    - cron: '0 1 * * *'
    # 每天北京时间12:00执行（UTC时间4:00）
    - cron: '0 4 * * *'
    # 每天北京时间17:00执行（UTC时间9:00）
    - cron: '0 9 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  run-script:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r finnewscollectionbot/requirements.txt
          
      - name: Run the script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          cd finnewscollectionbot
          python financebot.py --now
          
      - name: Upload generated Word document
        uses: actions/upload-artifact@v4
        with:
          name: finance-news-documents
          path: finnewscollectionbot/output/*.docx
